name: vani
description: "Vani - social media manager: post, schedule and answer across Instagram, YouTube, Facebook, LinkedIn, Threads, Bluesky and Mastodon, with discovery alerts (Linux, Windows, Android). Part of Brahma."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  # Shared core of the Brahma apps. pubspec_overrides.yaml points it at a
  # local checkout during development.
  brahma_core:
    git:
      url: https://github.com/sudharamachandranrajeev/brahma.git
      path: core
  drift: ^2.35.2
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  font_awesome_flutter: ^11.0.0
  http: ^1.6.0
  intl: ^0.20.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  # Inter for reading (built for screens, sharp at small sizes); Plus Jakarta
  # Sans for headings. Both SIL OFL 1.1, bundled so no font is fetched.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# Bundle SQLite3MultipleCiphers instead of plain SQLite so the local database
# is encrypted at rest on every platform (see doc/hook.md in package:sqlite3).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
