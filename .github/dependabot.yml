# Weekly dependency updates, grouped so each ecosystem opens at most one
# routine pull request. Security fixes arrive separately, as soon as an
# advisory is published (repo setting: Dependabot security updates).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /app/android
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      gradle-app-android:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /server
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-server:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /watch
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-watch:
        update-types: [minor, patch]
  - package-ecosystem: pub
    directory: /app
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      pub-app:
        update-types: [minor, patch]
  - package-ecosystem: pub
    directory: /core
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      pub-core:
        update-types: [minor, patch]
