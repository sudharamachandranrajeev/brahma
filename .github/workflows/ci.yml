name: CI

# Core and the suite app. The apps under apps/ are tested in their own
# repositories, where they are developed; here they build as part of app/.
on:
  push:
    branches: [main]
    paths: ['core/**', 'app/**', 'apps/**', '.github/workflows/ci.yml']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, app]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev >/dev/null
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Linux build
        if: matrix.package == 'app'
        run: flutter build linux --release

  android-build:
    name: android build (debug key)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      # Debug-signed, every push: catches Android build breaks fast. The
      # release-signed APK and emulator smoke test stay in release.yml,
      # gated on a v* tag, where the signing secrets are available.
      - name: Build the APK (debug key)
        run: flutter build apk --debug

  windows-build:
    name: windows build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      # No installer/VC++ bundling here (that's release.yml); just prove the
      # Windows build compiles on every push.
      - name: Build
        run: flutter build windows --release
