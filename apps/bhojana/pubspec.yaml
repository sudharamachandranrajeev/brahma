name: bhojana
description: "Bhojana - grocery and shopping: lists, UK price comparison across shops, live prices and basket filling through your own shop logins (Linux, Windows, Android). Part of Brahma."
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: ^3.13.5

dependencies:
  # Shared core of the Brahma apps. pubspec_overrides.yaml points it at a
  # local checkout during development.
  brahma_core:
    git:
      url: https://github.com/sudharamachandranrajeev/brahma.git
      path: core
  drift: ^2.35.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  url_launcher: ^6.3.2
  # The in-app browser for shop logins, live prices and baskets (Android,
  # Windows, and Linux through WPE WebKit). 6.2 beta: 6.1's Android plugin
  # fails under Android Gradle Plugin 9 (proguard-android.txt).
  flutter_inappwebview: 6.2.0-beta.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

dependency_overrides:
  # The web view's Linux plugin with libwpe made optional: WPE WebKit 2.52+
  # (Arch, Fedora) no longer ships it. See packages/flutter_inappwebview_linux.
  flutter_inappwebview_linux:
    path: packages/flutter_inappwebview_linux

flutter:
  uses-material-design: true
  # Inter for reading (built for screens, sharp at small sizes); Plus Jakarta
  # Sans for headings. Both SIL OFL 1.1, bundled so no font is fetched.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# Bundle SQLite3MultipleCiphers instead of plain SQLite so the local database
# is encrypted at rest on every platform (see doc/hook.md in package:sqlite3).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
