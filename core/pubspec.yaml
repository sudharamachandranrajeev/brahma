name: brahma_core
description: "Shared core of the Brahma apps: encrypted local database, end-to-end encrypted sync, money, and the UI kit."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.5
  flutter: ">=3.38.0"

dependencies:
  cryptography: ^2.9.0
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  pocketbase: ^0.25.2
  qr: ^4.0.0
  sqlite3: ^3.7.1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
